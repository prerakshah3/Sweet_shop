name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
        name: Inject API URL
        working-directory: Frontend
        run: echo "VITE_API_URL=${{ secrets.PAGES_API_URL }}" > .env.production
      - run: npm run build
        working-directory: Frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

